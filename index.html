<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASOC-SGN – Link đánh giá theo ca trực</title>
<style>
:root{
  --navy:#0b4f9c;--blue:#1c8ee0;--sky:#38c0f5;--gold:#f5a623;--gold-soft:#fff3d6;
  --bg:#eaf6ff;--card:#fff;--text:#12304d;--muted:#5f7a93;--line:#cfe6f7;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2038;--card:#15304f;--text:#eaf4ff;--muted:#a5bfd8;--line:#264a72;--gold-soft:#3a2f12}}
:root[data-theme="dark"]{--bg:#0d2038;--card:#15304f;--text:#eaf4ff;--muted:#a5bfd8;--line:#264a72;--gold-soft:#3a2f12}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% 0,rgba(56,192,245,.18),transparent 45%),radial-gradient(circle at 90% 30%,rgba(245,166,35,.12),transparent 40%),var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.45;min-height:100vh}
header{position:relative;overflow:hidden;background:linear-gradient(120deg,#0b5fc0,#1c8ee0 55%,#38c0f5);color:#fff;padding:26px 16px 34px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(28,142,224,.3)}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
header::before{width:180px;height:180px;right:-40px;top:-70px}
header::after{width:110px;height:110px;right:90px;bottom:-60px;background:rgba(245,166,35,.35)}
.wrap{max-width:860px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{flex:none;background:#fff;border-radius:16px;padding:6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:fly 4s ease-in-out infinite}.logo img{display:block;height:54px;width:auto;max-width:100%}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(4px,-5px) rotate(-8deg)}}
h1{margin:0;font-size:1.35rem;letter-spacing:.3px}
.sub{margin:2px 0 0;font-size:.88rem;opacity:.92}
main{padding:22px 16px 40px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 12px}
.shifts{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin-bottom:26px}
.shift{--c:#1c8ee0;border:2px solid transparent;background:var(--card);color:var(--text);border-radius:16px;padding:16px 8px;font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s;box-shadow:0 3px 10px rgba(28,100,160,.1)}
.shift span{font-size:1.5rem;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent)}
.shift:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 8px 18px rgba(28,100,160,.18)}
.shift.active{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#fff));color:#fff;transform:translateY(-3px);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 45%,transparent)}
.shift.active span{background:rgba(255,255,255,.25)}
#panel{--c:#1c8ee0}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-title h3{margin:0;font-size:1.2rem;color:var(--c)}
.count{font-size:.8rem;background:var(--c);color:#fff;padding:3px 12px;border-radius:99px;font-weight:700}
.links{display:grid;gap:12px}
a.link{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;text-decoration:none;color:var(--text);box-shadow:0 2px 8px rgba(28,100,160,.08);transition:.2s;animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
a.link:hover{transform:translateY(-3px) scale(1.01);border-color:var(--c);box-shadow:0 8px 18px rgba(28,100,160,.16)}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:color-mix(in srgb,var(--c) 16%,transparent)}
.ico.sheet{background:#dff7e6}
.name{font-weight:700}
.tag{display:inline-block;font-size:.72rem;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 8px;border-radius:99px;margin-top:2px}
.go{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;transition:.2s}
a.link:hover .go{transform:rotate(45deg)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:0 16px 24px}

html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#panel{scroll-margin-top:12px}
.shift,a.link{touch-action:manipulation}
.shift:active,a.link:active{transform:scale(.97)}
@media (hover:none){.shift:hover,a.link:hover{transform:none}a.link:hover .go{transform:none}}
@media (max-width:600px){
  header{padding:16px 14px 22px;border-radius:0 0 22px 22px}
  .brand{flex-direction:column;align-items:flex-start;gap:10px}
  .logo{padding:4px 10px;border-radius:12px}
  .logo img{height:38px}
  h1{font-size:1.1rem;line-height:1.25}
  .sub{font-size:.76rem}
  main{padding:16px 12px 32px}
  h2{font-size:.72rem;margin-bottom:8px}
  .shifts{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
  .shift{padding:10px 4px;border-radius:14px;font-size:.82rem;gap:4px;min-height:84px;justify-content:center;text-align:center}
  .shift span{width:38px;height:38px;font-size:1.25rem;border-radius:12px}
  .panel-title h3{font-size:1.05rem}
  .count{font-size:.72rem;padding:2px 10px}
  .links{gap:10px}
  a.link{padding:12px;gap:12px;min-height:68px;border-radius:14px}
  .ico{width:42px;height:42px}
  .name{font-size:.95rem;line-height:1.3}
  .tag{font-size:.7rem}
  .go{width:34px;height:34px}
  footer{font-size:.72rem}
}
@media (max-width:340px){.shift{font-size:.74rem}.shifts{gap:6px}}

[hidden]{display:none!important}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--navy);font:inherit;font-weight:700;padding:10px 16px;border-radius:99px;margin-bottom:16px;cursor:pointer;box-shadow:0 2px 8px rgba(28,100,160,.15);min-height:44px;touch-action:manipulation}
.back:active{transform:scale(.96)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .back{color:#9ccdf5}}
:root[data-theme="dark"] .back{color:#9ccdf5}
@media (min-width:601px){.shifts{grid-template-columns:repeat(3,1fr)}.shift{padding:22px 8px;font-size:1.05rem}.shift span{width:56px;height:56px;font-size:1.8rem}}

/* Full-screen layout */
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;padding:18px 14px 22px}
main>.wrap{flex:1;display:flex;flex-direction:column;width:100%;max-width:1100px}
#home:not([hidden]){flex:1;display:flex;flex-direction:column}
#detail:not([hidden]){flex:1;display:flex;flex-direction:column}
#panel{flex:1;display:flex;flex-direction:column}
h2{font-size:.95rem;margin-bottom:12px}
.shifts{flex:1;margin-bottom:0;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:14px}
.shift{min-height:120px;padding:12px 6px;font-size:1.15rem;gap:10px;border-radius:22px;justify-content:center}
.shift span{width:72px;height:72px;font-size:2.4rem;border-radius:22px}
.panel-title h3{font-size:1.4rem}
.count{font-size:.85rem}
.links{flex:1;grid-auto-rows:minmax(84px,150px);align-content:start;gap:14px}
a.link{padding:16px 18px;gap:16px;border-radius:20px;min-height:84px}
.ico{width:56px;height:56px;font-size:1.7rem;border-radius:16px}
.name{font-size:1.08rem}
.tag{font-size:.8rem}
.go{width:42px;height:42px;font-size:1.1rem}
.back{font-size:1.05rem;padding:12px 20px}
@media (min-width:700px){
  .shifts{grid-template-columns:repeat(3,1fr)}
  .shift{font-size:1.4rem}
  .shift span{width:88px;height:88px;font-size:3rem}
  .name{font-size:1.25rem}
}
@media (max-width:600px){
  .shifts{grid-template-columns:repeat(2,1fr);gap:12px}
  .shift{min-height:110px;font-size:1.12rem;padding:10px 4px}
  .shift span{width:68px;height:68px;font-size:2.2rem}
  a.link{padding:14px;min-height:84px}
  .name{font-size:1.02rem}
  .ico{width:52px;height:52px}
  main{padding:14px 12px 18px}
}
</style>
</head>

const sh=document.getElementById("shifts"),panel=document.getElementById("panel"),home=document.getElementById("home"),detail=document.getElementById("detail");
function render(id){
  const s=SHIFTS.find(x=>x.id===id);
  if(!s){detail.hidden=true;home.hidden=false;window.scrollTo(0,0);return}
  const items=s.l.map(k=>L[k]);
  panel.style.setProperty("--c",s.c);
  panel.innerHTML=`<div class="panel-title"><h3>${s.i} ${s.n}</h3><span class="count">${items.length} liên kết</span></div>`+
   (items.length?`<div class="links">${items.map((x,i)=>`<a class="link" style="animation-delay:${i*60}ms" href="${x.u}" target="_blank" rel="noopener noreferrer"><div class="ico ${x.k===F?"":"sheet"}">${x.k===F?"📝":"📊"}</div><div><div class="name">${x.t}</div><div class="tag">${x.k===F?"Google Form":"Google Sheets"}</div></div><span class="go">↗</span></a>`).join("")}</div>`:
   `<div class="empty">Ca trực này chưa có liên kết nào được cấu hình.</div>`);
  home.hidden=true;detail.hidden=false;window.scrollTo(0,0);
}
function go(id){render(id);try{history.pushState({id},"")}catch(e){}}
function back(){render(null);try{history.pushState({id:null},"")}catch(e){}}

document.getElementById("back").onclick=back;
window.addEventListener("popstate",e=>render(e.state&&e.state.id||null));
